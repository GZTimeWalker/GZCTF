name: Build & Publish Image

on:
  push:
    branches: [ "develop", "ci/*", "v*" ]
    tags: [ "v*" ]
    paths: [ "src/**" ]
  workflow_dispatch:

env:
  # latest tag is only created for `v*.*.*` or `v*.*.*-patch.*` tags
  RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && (contains(github.ref,
    'patch') || !contains(github.ref, '-')) }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: src/GZCTF
    env:
      SixLaborsLicenseKey: ${{ secrets.SIXLABORS_LICENSE }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: src/global.json

      - uses: actions/setup-node@v6
        with:
          node-version: latest

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: latest

      - name: Get current date time
        id: datetime
        uses: Kaven-Universe/github-action-current-date-time@v1
        with:
          format: "YYYY-MM-DDTHH:mm:ssZ"

      - name: Docker setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Docker setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prebuild project
        run: |
          dotnet build "GZCTF.csproj" -c Release -o build

      - name: Publish project
        run: |
          dotnet publish "GZCTF.csproj" -c Release -o publish/linux/amd64 -r linux-x64 --no-self-contained /p:PublishReadyToRun=true

          # ignore arm64 for non-release tags
          if [ "${{ env.RELEASE }}" = "true" ]; then
            dotnet publish "GZCTF.csproj" -c Release -o publish/linux/arm64 -r linux-arm64 --no-self-contained /p:PublishReadyToRun=true /p:EFOptimizeContext=false
          fi
        env:
          VITE_APP_BUILD_TIMESTAMP: ${{ steps.datetime.outputs.time }}
          VITE_APP_GIT_SHA: ${{ github.sha }}
          VITE_APP_GIT_NAME: ${{ github.ref_name }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: gztime
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata action
        uses: docker/metadata-action@v6
        id: meta
        with:
          images: |
            gztime/gzctf
            ghcr.io/${{ github.repository }}/gzctf
          flavor: |
            latest=${{ env.RELEASE }}
          tags: |
            type=ref,event=branch
            type=match,enable=${{ env.RELEASE }},pattern=v\d+,group=0
            type=match,enable=${{ env.RELEASE }},pattern=v\d+.\d+,group=0
            type=match,enable=${{ env.RELEASE }},pattern=v\d+.\d+.\d+,group=0

      - name: Publish images
        uses: docker/build-push-action@v7
        with:
          context: ./src/GZCTF
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: ${{ env.RELEASE == 'true' && 'linux/amd64,linux/arm64' ||
            'linux/amd64' }}
          push: true

  mirror-aliyun:
    needs: build
    if: (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v')) && vars.ALIYUN_MIRROR_RUNNER != ''
    continue-on-error: true
    runs-on: ${{ vars.ALIYUN_MIRROR_RUNNER }}
    permissions:
      contents: read

    steps:
      - name: Login to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: registry.cn-shanghai.aliyuncs.com
          username: ${{ secrets.ALIYUN_USER }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Verify regctl
        run: regctl version

      - name: Docker metadata action (GHCR)
        uses: docker/metadata-action@v6
        id: meta-ghcr
        with:
          images: ghcr.io/${{ github.repository }}/gzctf
          flavor: |
            latest=${{ env.RELEASE }}
          tags: |
            type=ref,event=branch
            type=match,enable=${{ env.RELEASE }},pattern=v\d+,group=0
            type=match,enable=${{ env.RELEASE }},pattern=v\d+.\d+,group=0
            type=match,enable=${{ env.RELEASE }},pattern=v\d+.\d+.\d+,group=0

      - name: Docker metadata action (Aliyun)
        uses: docker/metadata-action@v6
        id: meta-aliyun
        with:
          images: |
            registry.cn-shanghai.aliyuncs.com/gztime/gzctf
          flavor: |
            latest=${{ env.RELEASE }}
          tags: |
            type=ref,event=branch
            type=match,enable=${{ env.RELEASE }},pattern=v\d+,group=0
            type=match,enable=${{ env.RELEASE }},pattern=v\d+.\d+,group=0
            type=match,enable=${{ env.RELEASE }},pattern=v\d+.\d+.\d+,group=0

      - name: Mirror images to Aliyun
        env:
          GHCR_TAGS: ${{ steps.meta-ghcr.outputs.tags }}
          ALIYUN_TAGS: ${{ steps.meta-aliyun.outputs.tags }}
        run: |
          set -euo pipefail

          # map tag suffix -> Aliyun reference
          declare -A targets
          while IFS= read -r ref; do
            [ -z "$ref" ] && continue
            targets["${ref##*:}"]="$ref"
          done <<< "$ALIYUN_TAGS"

          # copy each published GHCR tag to Aliyun, no rebuild
          while IFS= read -r src; do
            [ -z "$src" ] && continue
            tag="${src##*:}"
            dst="${targets[$tag]:-}"
            if [ -z "$dst" ]; then
              echo "::warning::No Aliyun target for tag '$tag', skipping"
              continue
            fi

            echo "Mirroring $src -> $dst"
            ok=false
            for attempt in 1 2 3 4 5; do
              if regctl image copy "$src" "$dst"; then
                ok=true
                break
              fi
              echo "Attempt $attempt failed, retrying in $((attempt * 15))s..."
              sleep $((attempt * 15))
            done
            if [ "$ok" != true ]; then
              echo "::error::Failed to mirror $src to $dst after retries"
              exit 1
            fi
          done <<< "$GHCR_TAGS"

  prune:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    permissions:
      contents: read
      packages: write
    steps:
      - name: Prune old packages
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: gzctf/gzctf
          exclude-tags: latest,develop,work,v*
          validate: true
          dry-run: false
          delete-untagged: true
          delete-ghost-images: true
          delete-partial-images: true
